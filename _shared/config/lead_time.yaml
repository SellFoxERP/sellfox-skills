# ============================================================================
# 头程到货周期（lead_time.yaml）
# ============================================================================
# 影响技能：技能 2「库存健康与补货」。断货预测的必需参数。
#
# 解析优先级（lookup precedence）：
#     by_sku  >  by_supplier  >  by_shipping_method  >  default
# 即：命中最具体的层级；四级都没命中才算「解析不到」，触发批量询问。
#
# 旺季系数（seasonal_adjustment）在基础值上相乘，可叠加多个区间。
#   例：基础 45 天，日期落在 11-01~12-25 → 45 × 1.3 = 58.5 天
#
# 使用说明：
#   - 本文件由使用者维护；技能在缺失时会「一次性批量询问」并询问是否回写本文件。
#   - ⚠️ 用到 default 时，技能必须在输出中显式标注「默认值」，提示置信度低。
#   - 修改后无需重启：技能每次执行时重新读取。

# 兜底默认值。⚠️ 用到它时技能会在输出中标注「默认值」
default: 45

# ── 按运输方式 ──
by_shipping_method:
  海运: 45
  空运: 12
  快递: 7
  铁路: 35
  卡航: 25

# ── 按供应商（比运输方式优先）──
by_supplier:
  # 深圳XX电子: 40
  # 义乌XX家居: 50

# ── 按 SKU / MSKU（最高优先级）──
by_sku:
  # MOCK-SKU-001: 45

# ── 旺季系数（可选，在基础值上相乘）──
# 例：基础 45 天，落在 11-01~12-25 区间 → 45 × 1.3 = 58.5 天
seasonal_adjustment:
  # "11-01~12-25": 1.3     # 黑五网一
  # "01-20~02-20": 1.5     # 春节