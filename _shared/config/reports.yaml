# ============================================================================
# 自定义报表 ID（reports.yaml）—— ⭐ 一等前置配置，不是脚注
# ============================================================================
# get_custom_report_page_list 需要 report_id；137 个工具中没有任何一个能列出报表。
# 用户必须去赛狐网页端「自定义报表」中创建报表并手工记下 ID。
#
# 影响技能：技能 1（日报）、技能 2（库存）、技能 5（利润诊断）都依赖它。
# ⚠️ 没有它，技能 1/2/5 取不到 489 字段宽表。
#
# 技能首轮引导：检测到 id 为空时，技能应主动提示用户去赛狐创建报表并回填，
#   并给出需要勾选的字段清单（fields_hint）。
#
# 缺失时的降级路径（不能直接崩）：
#   技能 1 → 降级用 get_profit_report_by_shop + get_online_product_page_list，
#            并在日报中标注「口径降级：缺少自定义报表，部分指标不可用」
#   技能 2 → 降级用 get_online_product_page_list 的 inventoryManage 子对象（41 字段）
#   技能 5 → 降级只用 get_profit_report_by_msku，并声明赔偿/成本类归因不可用

reports:
  daily_ops:                       # 日报用
    id: ""                         # ← 填入赛狐报表 ID
    purpose: "经营日报全指标"
    fields_hint: "库存/流量/广告/评论/退款"

  inventory:                       # 库存用
    id: ""
    purpose: "库存健康与补货"
    fields_hint: "可售天数/在途/库龄分桶/周转/补货建议"

  profit:                          # 利润诊断用
    id: ""
    purpose: "成本/赔偿/延期结算"
    fields_hint: "采购成本/头程/赔偿/延期结算/长期仓储费"