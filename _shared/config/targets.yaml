# ============================================================================
# 经营目标（targets.yaml）
# ============================================================================
# 影响技能：技能 4「周报/月报与目标追踪」。用于计算达成率。
#
# 用法：达成率 = 实际值 / 目标值。目标值的来源必须在输出中标注「配置命中」。
# 未配置目标时，技能标注「未配置目标值，无法计算达成率」，不得编造目标。
#
# ⚠️ 目标值一律外置，绝不硬编码。

monthly:
  # "2026-09":
  #   gmv: 1500000            # 月 GMV 目标
  #   gross_profit: 300000    # 月毛利目标
  #   gross_profit_rate: 20   # 月毛利率目标 %
  #   ad_cost_rate_max: 12    # 广告成本占比上限 %

quarterly:
  # "2026-Q3":
  #   gmv: 4500000
  #   gross_profit: 900000

yearly:
  # "2026":
  #   gmv: 18000000

# 同比/环比对比基线开关
compare:
  yoy: true                     # 启用同比
  mom: true                     # 启用环比

# 达成率分级（用于输出着色/标注）
achievement:
  excellent_min: 100           # ≥100% 达标
  warning_min: 80              # 80%~100% 预警
  # < warning_min 视为未达标