# ============================================================================
# VOC 字段 → 数据源映射（field-map.yaml）
# ============================================================================
# 权威依据：_shared/FIELD_DICTIONARY.md。
# 只登记「已核对存在」的字段。凡字段实际不在所列工具中，就是降级/需人工核查。
#
# 抽查字段是否存在，一律以 当前 MCP 契约与共享字段字典 为准，**不得凭记忆**。
#
# sources:
#   custom = get_custom_report_page_list  （分页类，data.rows；489 字段；需 report_id）
#   online = get_online_product_page_list （分页类，data.rows；79 字段）
#
# ⚠️ 严禁把下列字段误判为「不存在」（曾经发生过，已被纠正）：
#   adOrderConversionRate / threeSaleNum —— 经一手实测确认为真实字段。
#   本技能虽不直接用它们，但 field-map 的「假阴性」教训同样适用：
#   rating / ratingCount 两个工具**都有**，lowReviewNum/reviewNum/reviewRate
#   **只在 custom**（在线产品 79 字段里没有）。
# ============================================================================

# ---------- 发现问题 ASIN：聚合评论指标 ----------
discovery_fields:

  rating:
    field: rating
    source: [custom, online]
    note: 字符串，实测样例 "4.5"。**不存在历史序列**，环比需外部快照（见 workflow.md §4）。

  ratingCount:
    field: ratingCount
    source: [custom, online]
    note: 评论数。小样本（< min_rating_count）不判「评分下滑」。

  lowReviewNum:
    field: lowReviewNum
    source: [custom]
    note: ⚠️ **仅 489 宽表可得**，online 侧没有。差评数（评论 VOC 的核心信号）。

  reviewNum:
    field: reviewNum
    source: [custom]
    note: ⚠️ **仅 489 宽表可得**。评论总数，与 lowReviewNum 配合算差评占比。

  reviewRate:
    field: reviewRate
    source: [custom]
    note: ⚠️ **仅 489 宽表可得**。好评率/评分率（实测样例 4.5）。

# ---------- 归因定位用的辅助维度 ----------
context_fields:

  asin:
    field: asin
    source: [custom, online]
    note: VOC 归因主键（外部评论 MCP 按 ASIN 拉原文）。

  parentAsin:
    field: parentAsin
    source: [custom, online]
    note: 变体聚合；外部评论源一般为父 ASIN 维度，注意与子 ASIN 的口径差异。

  msku:
    field: msku
    source: [custom]
    note: ⚠️ **仅 489 宽表可得**。用于把问题定位到具体变体/配色。

  sku:
    field: sku
    source: [custom, online]

  shopId:
    field: shopId
    source: [custom, online]
    note: 店铺维度（告警路由）。

  marketplaceId:
    field: marketplaceId
    source: [custom, online]
    note: 站点；外部评论源通常分市场（10 市场），口径须对齐。

  title:
    field: title
    source: [custom, online]
    note: 商品标题，辅助判断「描述不符」类差评。

  mainImage:
    field: mainImage
    source: [custom, online]
    note: 主图 URL，辅助判断「色差/与图不符」。

  saleNum:
    field: saleNum
    source: [custom, online]
    note: 销量；用于按影响面排序（有销量的差评优先深挖）。

  buyBoxPercent:
    field: buyBoxPercent
    source: [custom]
    note: ⚠️ **仅 489 宽表可得**（实测样例 92.5）。丢购物车可能与差评并发，辅助关联。

# ---------- 外部评论 MCP 应返回的字段（适配器契约）----------
external_review_contract:
  # 适配器**至少**要能提供以下字段；缺字段时技能如实降级，不编造。
  required:
    - id            # 评论唯一 ID（去重、数独立评论）
    - asin          # 所属 ASIN
    - rating        # 星级 1~5（用于筛差评）
    - text          # 评论正文（归因分析的输入）
  optional:
    - title         # 评论标题
    - date          # 评论日期（时效加权）
    - reviewer_id   # 评论者唯一标识（**数独立评论者**，勿用昵称）
    - reviewer_name # 评论者昵称（PII，输出前掩码）
    - marketplace   # 站点
    - verified      # 是否已验证购买
    - helpful_votes # 有用票数（可作权重）
  forbidden_in_output:
    - reviewer_name # 掩码后再输出
