# ============================================================================
# 汇率配置（fx.yaml）—— 跨币种换算的唯一来源
# ============================================================================
# 用途：上架包定价测算时，售价口径（get_online_product_page_list 顶层 currency = USD）
#       与成本口径（inventoryManage.currency = CNY）不同，**必须显式换算**，
#       不得直接相减。
#
# ⚠️ 铁律：跨币种必须标注「汇率来源 + 日期」。未配置时脚本标「需人工核查」，
#   不按臆测汇率计算。
# ⚠️ 汇率会浮动，请定期更新本文件（或改为从你信任的数据源程序化刷新）。
# ============================================================================

# 换算方向：把 quote 货币换算成 base 货币时使用的乘数（rate 表示 1 base = rate quote）。
# 这里以「换算到 USD」为例。使用者按实际需要填写。
base: "USD"
quote: "CNY"
rate: null                 # 例：7.1 表示 1 USD = 7.1 CNY；未填 = 需人工核查
source: "需人工核查（请填写你采用的汇率来源，如中国银行中间价 / 平台结算汇率）"
as_of: null                # 汇率日期（yyyy-MM-dd）；未填 = 需人工核查