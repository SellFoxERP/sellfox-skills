# ============================================================================
# 合规检查词表（本技能只读，永不写入）
# ============================================================================
# 参考 listing-compliance 的只读检查思路 的定位：**写前咨询门，永不写入**。
# 本文件由使用者按平台最新政策维护。检查结果只是风险提示，不构成法律意见。
#
# ⚠️ 下面的词表是「示例起点」，不是权威清单。请按目标站点/类目的最新官方政策维护，
#    并自行补充品牌/专利相关的关注词。
# ⚠️ 本技能无法访问商标/专利数据库，因此商标/专利部分只能给出**人工核查提示**。
# ============================================================================

# ── 绝对化/承诺性表述（多为平台禁用的营销词）──
banned_words:
  - "best seller"
  - "best-seller"
  - "bestselling"
  - "#1"
  - "number one"
  - "top rated"
  - "guaranteed"
  - "100% safe"
  - "cure"
  - "fda approved"
  - "epa approved"
  - "eco-friendly"          # 未经认证时属高风险表述
  - "free shipping"

# ── 商标/品牌关注词（命中仅提示人工核查，不得据此判定侵权）──
trademark_watch: []

# ── 需要品类审核/资质的关键词（命中提示人工确认类目要求）──
category_approval_hints:
  - "battery"
  - "lithium"
  - "medical"
  - "food"
  - "supplement"
  - "cosmetic"
  - "toy"
  - "children"

# ── AI 生成素材标注 ──
# 部分平台/类目要求披露 AI 生成内容。命中 true 时，输出中固定加一条披露提示。
ai_label_required: true

# ── 输出免责声明（写入合规检查区块）──
disclaimer: "本合规检查为写前风险提示，不构成法律意见，也不能替代平台官方审核。商标/专利/资质结论一律需人工核查。"