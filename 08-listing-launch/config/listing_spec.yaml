# ============================================================================
# 亚马逊 Listing 字段规范（字符/字节限制等）
# ============================================================================
# ⚠️ 本次调研**未能验证**亚马逊各品类的确切字符限制（检索失败）。
#    因此本文件默认全部留空。**技能绝不写死数字**。
#
# 使用方式：
#   1. 使用者登录 Seller Central，按目标站点的最新官方要求填写下面的值；
#   2. 未填写的项，脚本/output 会显式标注「⚠️ 需人工核查」，**绝不编造**；
#   3. 文案生成与合规检查都读取本文件，改完即可生效，无需改代码。
#
# 字段含义与校验口径见 references/amazon-listing-spec.md（读那个文件了解怎么填）。
# ============================================================================

# ── 兜底默认（未按站点/类目命中时使用）──
# 全部留空 = 强制人工核查。
default:
  title_max_chars: null
  bullet_count: null
  bullet_max_chars: null
  search_terms_max_bytes: null
  description_max_chars: null

# ── 按站点覆盖 ──
# 例：
# US:
#   title_max_chars: 200
#   bullet_count: 5
#   bullet_max_chars: 500
#   search_terms_max_bytes: 250
#   description_max_chars: 2000
by_marketplace: {}

# ── 按类目覆盖（优先级最高；key 用类目名或类目 ID）──
# 例：
# "家居":
#   title_max_chars: 200
#   bullet_count: 5
by_category: {}

# ============================================================================
# 素材规格（图片 / 视频）
# ============================================================================
# ⚠️ 以下为常见起始值，**请按亚马逊官方最新要求核对后再用**。
#    脚本会把 effective 值写进 asset-brief.json，并在输出中标注来源为「配置命中」。
#    若某项填 null，则按「⚠️ 需人工核查」处理，绝不编造。
# ============================================================================
assets:
  main_image:
    bg: "pure_white_rgb_255"   # 主图背景要求（纯白底）
    min_px: 1600               # 建议最小边长（越高越好，支持放大）
    product_ratio: 0.85        # 商品主体占画面比例下限
    aspect: "1:1"
  scene_image:
    aspect: "1:1"
    min_px: 1000
  aplus_module:
    aspect: null               # A+ 各模块尺寸不一，留空 = 需人工核查
    min_px: 970
  video:
    duration_s: 30             # 主图视频建议时长（秒）
    aspect: "16:9"
    max_mb: 500                # 文件大小上限（MB）
    formats: ["mp4", "mov"]