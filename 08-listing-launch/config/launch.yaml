# ============================================================================
# 技能 08-listing-launch 特有配置：素材计划、成本估算、生图适配器
# ============================================================================
# 业务参数一律外置，技能绝不硬编码。使用者可按品类/站点在此调整。
# ⚠️ 修改后无需重启：每次执行脚本时重新读取。
# ============================================================================

# ── 素材数量计划（生成 asset-brief.json 时按此展开）──
# 数量决定生图/生视频的**调用次数与花费**，因此是成本闸的输入。
asset_plan:
  main_image: 1            # 主图（纯白底）
  scene_image: 6           # 场景图/卖点图
  aplus_module: 5          # A+ 模块图
  video: 1                 # 主图视频
  infographic: 0           # 信息图（可选，0 = 不生成）
  lifestyle: 0             # 生活方式图（可选）

# ── 默认站点（未指定时兜底；站点影响文案语言与字符规范）──
default_marketplace: "US"
marketplace_locale:
  US: "en-US"
  UK: "en-GB"
  DE: "de-DE"
  FR: "fr-FR"
  JP: "ja-JP"
  # 其它站点按需补充

# ── 生成成本估算（用于「报数量与成本待确认」闸门）──
# ⚠️ 本次调研无法得知你所选生图/生视频 MCP 的实际计费，故此处**留空**。
#    未配置时脚本输出「⚠️ 需人工核查：未配置单价」，**绝不按 0 元估算**。
estimator:
  currency: "USD"
  cost_per_image: null     # 每张图单价（生图 MCP 报价）
  cost_per_video: null     # 每个视频单价（生视频 MCP 报价）
  require_confirmation: true   # 生成前必须先输出数量与成本，人工确认后才批量生成

# ── 生图 / 生视频适配器（可插拔）──
# 这里只登记你选用的 MCP 名称与调用说明；真正的 MCP 调用由 AI 助手 按
# references/asset-brief-spec.md 的适配器契约执行。留空表示未接入。
adapter:
  image: ""                # 例："MiniMax text_to_image" / "Nano-Banana-MCP"
  video: ""                # 例："MiniMax generate_video (Hailuo-02)"
  prompt_style: "ecommerce"

# ── 交付设置 ──
delivery:
  write_feishu: false          # 是否把上架包写入飞书（演示环境默认阻断）
  feishu_folder_token: ""      # 目标文件夹 token；留空 = 应用根目录
  local_out_dir: "out"         # 本地输出目录（相对技能根目录）

# ── 定价与利润测算参数 ──
# ⚠️ 费用结构只作为「缺省估算」；若能从赛狐字段取到真实费用（referralFee/fbaFees 等），
#    脚本优先用真实字段，并在输出中标注来源。缺失时标「需人工核查」，不臆造。
pricing:
  target_gross_margin_pct: 25    # 目标毛利率（倒推建议售价用），% ；null = 不做倒推
  default_referral_fee_pct: null # 平台佣金率缺省值，% ；null = 需人工核查
  default_fba_fee: null          # FBA 配送费缺省值；null = 需人工核查
  # 头程成本口径说明：
  #   首选商品行字段 headTripCost（get_online_product_page_list 行内实测返回，成本口径）；
  #   缺值时再走宽表 get_custom_report_page_list 的 headTripPrice（补充源）或人工核查。
  headtrip_source: "商品行 headTripCost 无值，需人工核查（宽表 get_custom_report_page_list / reports.yaml: profit 为补充源）"